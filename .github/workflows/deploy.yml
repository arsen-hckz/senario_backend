name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/senario_backend
            git pull origin main
            docker-compose build web
            docker-compose stop web
            docker-compose rm -f web
            # --no-deps: without it, docker-compose (v1.29) re-evaluates db/redis for
            # recreation too and can hit a KeyError('ContainerConfig') bug against newer
            # Docker Engine image metadata, taking db down along with a failed deploy.
            docker-compose up -d --no-deps web
            docker-compose exec -T web python manage.py migrate
            docker-compose exec -T web python manage.py collectstatic --noinput