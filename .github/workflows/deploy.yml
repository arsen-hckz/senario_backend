name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Abort on the first failure — otherwise a failed git pull still
            # rebuilds the old code and the run shows green.
            set -e
            cd /var/www/senario_backend
            git pull origin main
            docker compose build web
            # Migrate in a one-off container before the new web starts. Running
            # it alongside the container's own startup migrate raced on new
            # tables/columns ("already exists"), crashed web and took the API down.
            docker compose run --rm --no-deps -T web python manage.py migrate --noinput
            # --no-deps: a code deploy replaces only the web container and never
            # touches db/redis/nginx. Its startup command re-runs migrate (now a
            # no-op) and collectstatic before gunicorn.
            docker compose up -d --no-deps web
            # Fail the run (and show why) if the API isn't answering afterwards,
            # rather than reporting green while the site is down.
            for i in $(seq 1 30); do
              curl -sf -o /dev/null https://snr.arsenidis.dev/api/products/ && exit 0
              sleep 2
            done
            echo "API not responding after deploy"
            docker compose logs --tail=40 web
            exit 1
