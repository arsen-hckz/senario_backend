name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Abort on the first failure — otherwise a failed git pull still
            # rebuilds the old code and the run shows green.
            set -e
            cd /var/www/senario_backend
            git pull origin main
            docker compose build web
            # --no-deps: a code deploy replaces only the web container and never
            # touches db/redis/nginx.
            docker compose up -d --no-deps web
            docker compose exec -T -u app web python manage.py migrate
            docker compose exec -T -u app web python manage.py collectstatic --noinput
