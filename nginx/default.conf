upstream django {
    server web:8000;
}

# Don't advertise the nginx version in headers and error pages.
server_tokens off;

# First line of defence against request floods, per client IP, before
# anything reaches Django. Generous for real shoppers (a page load makes a
# handful of API calls); Django's own per-endpoint limits still apply after.
limit_req_zone  $binary_remote_addr zone=api:10m   rate=10r/s;
limit_req_zone  $binary_remote_addr zone=admin:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    server_name snr.arsenidis.dev;

    # Let's Encrypt renewal: certbot (webroot mode, on the host) writes the
    # challenge file to /var/www/certbot and this serves it over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    client_max_body_size 20M;
    server_name snr.arsenidis.dev;

    # Slow-client attacks: drop connections that dribble in headers or bodies.
    client_header_timeout 15s;
    client_body_timeout   15s;
    keepalive_timeout     30s;
    limit_conn perip 30;

    ssl_certificate /etc/letsencrypt/live/snr.arsenidis.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snr.arsenidis.dev/privkey.pem;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        limit_req zone=admin burst=20 nodelay;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # add_header here replaces the server-level ones, so repeat what Django sends.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # add_header here replaces the server-level ones, so repeat what Django sends.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # The storefront lives on Vercel; this host only serves the API, admin
    # and uploads. Anything else used to answer 200 with nginx's welcome page.
    location / {
        return 404;
    }
}
